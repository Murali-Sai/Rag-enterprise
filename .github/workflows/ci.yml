name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

  # Both suites run. `integration` boots the app through TestClient and is the
  # slower of the two; it is a separate matrix leg so a slow or failing
  # integration run cannot be mistaken for a unit failure in the checks list.
  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    name: test (${{ matrix.suite }})
    env:
      # `secrets` is not in scope for a step-level `if`, so the presence check
      # has to happen here, where it is.
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      # No OPENAI_API_KEY is set, deliberately: a test that needs one passes
      # locally off .env and fails everywhere else. Keeping the runner keyless
      # is what catches that.
      - name: Run tests
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: test-secret-key
        run: pytest tests/${{ matrix.suite }} --cov=src --cov-report=xml --cov-report=term:skip-covered

      # Skipped unless a CODECOV_TOKEN secret exists. Uploading without one
      # warns on every run and the warning is noise, not a signal.
      - name: Upload coverage
        if: env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.suite }}
        continue-on-error: true
